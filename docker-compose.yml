name: stealthguard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stealthguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stealthguard_dev}
      POSTGRES_DB: ${POSTGRES_DB:-stealthguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stealthguard} -d ${POSTGRES_DB:-stealthguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      MODEL_DIR: ${MODEL_DIR:-/app/models}
      HUMAN_THRESHOLD: ${HUMAN_THRESHOLD:-0.8}
      BOT_THRESHOLD: ${BOT_THRESHOLD:-0.4}
      MODEL_VERSION_SHADOW: ${MODEL_VERSION_SHADOW:-}
      DB_URL: postgresql://${POSTGRES_USER:-stealthguard}:${POSTGRES_PASSWORD:-stealthguard_dev}@db:5432/${POSTGRES_DB:-stealthguard}
    volumes:
      - ml_models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  java-gateway:
    build:
      context: .
      dockerfile: java-gateway/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-stealthguard}
      POSTGRES_USER: ${POSTGRES_USER:-stealthguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stealthguard_dev}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      HUMAN_ALLOW_THRESHOLD: ${HUMAN_ALLOW_THRESHOLD:-0.8}
      BOT_BLOCK_THRESHOLD: ${BOT_BLOCK_THRESHOLD:-0.4}
      MAX_EVENTS_PER_ARRAY: ${MAX_EVENTS_PER_ARRAY:-5000}
      HMAC_ENABLED: ${HMAC_ENABLED:-false}
      TRIAL_MODE: ${TRIAL_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      java-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5173/"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: ["bun", "run", "dev:admin"]
    ports:
      - "5174:5174"
    depends_on:
      java-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5174/"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: ["bun", "run", "dev:sandbox"]
    ports:
      - "5175:5175"
    depends_on:
      java-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5175/"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  ml_models:
  prometheus_data:
  grafana_data: