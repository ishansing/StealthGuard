spring:
  application:
    name: java-gateway
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/stealthguard}
    username: ${POSTGRES_USER:stealthguard}
    password: ${POSTGRES_PASSWORD:stealthguard_dev}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

stealthguard:
  ml-service-url: ${ML_SERVICE_URL:http://ml-service:8000}
  ml-timeout: ${ML_TIMEOUT:2s}
  human-allow-threshold: ${HUMAN_ALLOW_THRESHOLD:0.8}
  bot-block-threshold: ${BOT_BLOCK_THRESHOLD:0.4}
  # Per-modality profiles (Phase 9 A5): lenient for assistive flows so
  # keyboard-only / switch / touch users are never silently blocked.
  human-allow-threshold-keyboard: ${HUMAN_ALLOW_THRESHOLD_KEYBOARD:0.6}
  bot-block-threshold-keyboard: ${BOT_BLOCK_THRESHOLD_KEYBOARD:0.2}
  human-allow-threshold-touch: ${HUMAN_ALLOW_THRESHOLD_TOUCH:0.7}
  bot-block-threshold-touch: ${BOT_BLOCK_THRESHOLD_TOUCH:0.3}
  human-allow-threshold-switch: ${HUMAN_ALLOW_THRESHOLD_SWITCH:0.5}
  bot-block-threshold-switch: ${BOT_BLOCK_THRESHOLD_SWITCH:0.0}
  max-events-per-array: ${MAX_EVENTS_PER_ARRAY:5000}
  hmac-enabled: ${HMAC_ENABLED:false}
  trial-mode: ${TRIAL_MODE:false}
  challenge-answer: ${CHALLENGE_ANSWER:4}

resilience4j:
  circuitbreaker:
    instances:
      mlService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      mlService:
        max-attempts: 2
        wait-duration: 300ms

logging:
  level:
    root: ${LOG_LEVEL:INFO}