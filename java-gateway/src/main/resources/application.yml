spring:
  application:
    name: java-gateway
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/stealthguard}
    username: ${POSTGRES_USER:stealthguard}
    password: ${POSTGRES_PASSWORD:stealthguard_dev}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

stealthguard:
  ml-service-url: ${ML_SERVICE_URL:http://ml-service:8000}
  ml-timeout: ${ML_TIMEOUT:2s}
  human-allow-threshold: ${HUMAN_ALLOW_THRESHOLD:0.8}
  bot-block-threshold: ${BOT_BLOCK_THRESHOLD:0.4}
  max-events-per-array: ${MAX_EVENTS_PER_ARRAY:5000}
  hmac-enabled: ${HMAC_ENABLED:false}
  challenge-answer: ${CHALLENGE_ANSWER:4}

resilience4j:
  circuitbreaker:
    instances:
      mlService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      mlService:
        max-attempts: 2
        wait-duration: 300ms

logging:
  level:
    root: ${LOG_LEVEL:INFO}